spring:
  application:
    name: ai-gateway
  data:
    redis:
      host: localhost
      port: 6379
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/gateway
    username: gateway
    password: gateway
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text

gateway:
  providers:
    openai:
      enabled: true
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY:}
      timeout-seconds: 60
      models:
        - gpt-4o
        - gpt-4o-mini
    anthropic:
      enabled: true
      base-url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY:}
      timeout-seconds: 60
      default-max-tokens: 4096
      models:
        - claude-sonnet-4-5
        - claude-haiku-4-5
    ollama:
      enabled: true
      base-url: http://localhost:11434
      timeout-seconds: 120
      models:
        - llama3.2
  fallback-order:
    - openai
    - anthropic
    - ollama
  resilience:
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      wait-duration-in-open-state-seconds: 30
      permitted-calls-in-half-open-state: 5
    retry:
      max-attempts: 3
      initial-backoff-millis: 200
      backoff-multiplier: 2.0
      max-backoff-millis: 5000
      jitter-factor: 0.5
    timeout:
      seconds: 30
  tenant:
    cache-ttl-seconds: 30
    rate-limit-bucket-ttl-seconds: 120
  cache:
    enabled: true
    similarity-threshold: 0.95
    ttl-hours: 24
    max-cacheable-temperature: 0.3
  embedding:
    dimension: 768

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents
  metrics:
    tags:
      application: ai-gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    dev.gateway: DEBUG
    org.springframework.web: INFO
    org.springframework.http.codec: INFO